[extend]
useDefault = true

# Allowlist false positives by path or regex here, never by .gitleaksignore fingerprints.
# gitleaks rejects an allowlist with no check, so the placeholder matches nothing real.
[allowlist]
description = "Repo-local allowlist for gitleaks false positives"
regexes = ['''^herdr-mods-allowlist-placeholder$''']
paths = []
