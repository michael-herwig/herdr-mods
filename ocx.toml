# Every tool this repository runs comes from here: `ocx pull`, then `ocx exec -- task <name>`.
# ocx.lock pins each to a digest.
[tools]
task = "ocx.sh/go-task/task:3.53.1"
node = "ocx.sh/nodejs/node:24.21.0"
pnpm = "ocx.sh/pnpm/pnpm:11.22.0"
# The app loads and renders every mod in the checks; mods call herdr-core.
herdr-app = "ocx.sh/herdrdev/herdr-app:latest"
herdr-core = "ocx.sh/herdrdev/herdr-core:latest"

# `ocx exec -g lint -- <tool>` composes only this group.
[group.lint.tools]
prek = "ocx.sh/prek/prek:0.5.5"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
